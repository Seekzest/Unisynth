version: '3.8'

services:
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  server:
    build: ./server
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      STORAGE_DIR: /storage
      REDIS_URL: redis://redis:6379
    volumes:
      - ./server:/app
      - server_storage:/storage
    depends_on:
      - redis
      - minio

volumes:
  minio_data:
  redis_data:
  server_storage:
